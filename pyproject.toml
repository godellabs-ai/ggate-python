[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ggate"
version = "0.3.0"
description = "Godel's Gate SDK for monitoring Python AI agent frameworks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Godel Labs" }]
keywords = ["ai", "agents", "security", "llm", "monitoring"]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=3.7.0"]
langchain = ["langchain-core>=1.6.1"]
crewai = ["crewai>=1.15.18"]
autogen = ["autogen-agentchat>=0.4"]
llamaindex = ["llama-index-core>=0.10"]
haystack = ["haystack-ai>=2"]
semantic-kernel = ["semantic-kernel>=1"]
dspy = ["dspy>=2"]
phidata = ["phidata>=2"]
agno = ["agno>=1"]
all = [
  "openai>=3.7.0",
  "langchain-core>=1.6.2",
  "crewai>=1.15.18",
  "autogen-agentchat>=0.4",
  "llama-index-core>=0.10",
  "haystack-ai>=3.1.0",
  "semantic-kernel>=1",
  "dspy>=3.3.1",
  "phidata>=2",
  "agno>=3.0.5",
]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ggate"]
